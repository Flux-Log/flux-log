<script>
    const ctx = document.getElementById('myChart');
    const ctx2 = document.getElementById('myChart2');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: [
                'Segunda',
                'Terça',
                'Quarta',
                'Quinta',
                'Sexta',
                'Sábado',
                'Domingo'
            ],
            datasets: [{
                label: 'Setor de Limpeza',
                backgroundColor: 'rgb(15, 28, 38)',
                borderColor: 'rgb(15, 28, 38)',
                data: [4, 3, 5, 7, 8, 10, 12],
                borderWidth: 1
            },
            {
                label: 'Setor de Bebidas',
                backgroundColor: 'rgb(255, 123, 0',
                borderColor: 'rgb(255, 123, 0)',
                data: [6, 3, 4, 8, 10, 11, 9],
                borderWidth: 1
            },
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    new Chart(ctx2, {
        type: 'line',
        data: {
            labels: [
                'Segunda',
                'Terça',
                'Quarta',
                'Quinta',
                'Sexta',
                'Sábado',
                'Domingo'
            ],
            datasets: [{
                label: 'Setor de Limpeza',
                backgroundColor: 'rgb(15, 28, 38)',
                borderColor: 'rgb(15, 28, 38)',
                data: [4, 3, 5, 7, 8, 10, 12],
                borderWidth: 1
            },
            {
                label: 'Setor de Bebidas',
                backgroundColor: 'rgb(255, 123, 0',
                borderColor: 'rgb(255, 123, 0)',
                data: [6, 3, 4, 8, 10, 11, 9],
                borderWidth: 1
            },
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
