<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxLog - Monitoramento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

   
</head>

<body>

    <header class="header">
        <img src="./assets/logo-fluxlog-dashboard.png" alt="Logo FluxLog">
    </header>

    <main>
        <div class="menu">
           
            <nav>
            
                <a href="./index.html" class="active">Monitoramento</a>
           
            </nav>
        </div>

        <div class="dash-kpis">
            <div class="title-subtitle">
                <h1>Monitoramento de Fluxo</h1>
                <span>Acompanhe em tempo real as leituras dos sensores por unidade e setor</span>
            </div>

            <div class="select-container">
                <label for="selectEmpresa">UNIDADE MONITORADA:</label>
                <select id="selectEmpresa" onchange="trocarUnidade()">
                    <option value="1">Assaí Atacadão — Matriz</option>
                    <option value="2">Assaí Atacadão — São Paulo</option>
                    <option value="3">Assaí Atacadão — Morumbi</option>
                </select>
            </div>

            <div class="charts-grid">
                <!-- Card Setor Bebidas -->
                <div class="kpi-01">
                    <span>Setor Bebidas</span>
                    <div style="margin-top: 12px;">
                        <span id="statusBebidas" class="status-badge">Aguardando leitura...</span>
                    </div>
                    <div class="canvas-container">
                        <canvas id="graficoBebidas"></canvas>
                    </div>
                </div>

                <!-- Card Setor Alimentos -->
                <div class="kpi-01">
                    <span>Setor Alimentos</span>
                    <div style="margin-top: 12px;">
                        <span id="statusAlimentos" class="status-badge">Aguardando leitura...</span>
                    </div>
                    <div class="canvas-container">
                        <canvas id="graficoAlimentos"></canvas>
                    </div>
                </div>

                <!-- Card Setor Limpeza -->
                <div class="kpi-01">
                    <span>Setor Limpeza</span>
                    <div style="margin-top: 12px;">
                        <span id="statusLimpeza" class="status-badge">Aguardando leitura...</span>
                    </div>
                    <div class="canvas-container">
                        <canvas id="graficoLimpeza"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Função auxiliar simples para instanciar os gráficos nos mesmos moldes do Henrique
        function criarGrafico(idCanvas, titulo) {
            return new Chart(
                document.getElementById(idCanvas).getContext('2d'),
                {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: titulo,
                            borderColor: '#009874',
                            backgroundColor: '#009874',
                            data: [],
                            stepped: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Leituras'
                                }
                            },
                            y: {
                                min: 0,
                                max: 1,
                                ticks: {
                                    stepSize: 1
                                },
                                title: {
                                    display: true,
                                    text: 'Estado do sensor'
                                }
                            }
                        }
                    }
                }
            );
        }

        var graficoBebidas = criarGrafico('graficoBebidas', 'Bebidas (0 = livre, 1 = detectado)');
        var graficoAlimentos = criarGrafico('graficoAlimentos', 'Alimentos (0 = livre, 1 = detectado)');
        var graficoLimpeza = criarGrafico('graficoLimpeza', 'Limpeza (0 = livre, 1 = detectado)');

        var tempo = 0;

        function carregarSensor(idSensor, grafico, idStatus) {
            fetch('http://localhost:3300/sensores/digital/' + idSensor)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erro ao acessar a API');
                    }
                    return response.json();
                })
                .then(sensor => {
                    var leitura = Number(sensor.digital);

                    document.getElementById(idStatus).innerHTML =
                        leitura === 1
                            ? 'Objeto detectado!'
                            : 'Setor Livre';

                    // Altera a cor: verde (#009874) se for 0/false, laranja (#ff7900) se for 1/true
                    var corLinha = (leitura === 0) ? '#009874' : '#ff7900';
                    grafico.data.datasets[0].borderColor = corLinha;
                    grafico.data.datasets[0].backgroundColor = corLinha;

                    grafico.data.labels.push(tempo);
                    grafico.data.datasets[0].data.push(leitura);

                    if (grafico.data.labels.length > 20) {
                        grafico.data.labels.shift();
                        grafico.data.datasets[0].data.shift();
                    }

                    grafico.update();
                })
                .catch(error => {
                    console.error('Erro ao obter dados do sensor ' + idSensor, error);
                    document.getElementById(idStatus).innerHTML = 'Erro ao conectar com a API';
                });
        }
   // função dos graficos de 3 em 3.
        function obterDados() {
            var unidade = Number(document.getElementById('selectEmpresa').value);
            var sensorInicial = (unidade - 1) * 3 + 1;

            carregarSensor(sensorInicial, graficoBebidas, 'statusBebidas');
            carregarSensor(sensorInicial + 1, graficoAlimentos, 'statusAlimentos');
            carregarSensor(sensorInicial + 2, graficoLimpeza, 'statusLimpeza');

            tempo++;
        }

        function limparGrafico(grafico, idStatus) {
            grafico.data.labels = [];
            grafico.data.datasets[0].data = [];
            grafico.update();
            document.getElementById(idStatus).innerHTML = 'Aguardando leitura...';
        }

        function trocarUnidade() {
            limparGrafico(graficoBebidas, 'statusBebidas');
            limparGrafico(graficoAlimentos, 'statusAlimentos');
            limparGrafico(graficoLimpeza, 'statusLimpeza');
            tempo = 0;
            obterDados();
        }

        obterDados();
        setInterval(obterDados, 1000);
    </script>

</body>

</html>
