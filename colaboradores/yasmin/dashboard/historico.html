<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>Dashboard FluxLog</title>
</head>

<body>
    <header class="header">
        <img src="./assets/logo-fluxlog-dashboard.png" alt="">
    </header>
    <main>
        <div class="menu">
            <span>GERAL</span>
            <nav>
                <a href="./dashboard.html">Início</a>
                <a href="./historico.html" class="active">Histórico</a>
            </nav>
        </div>
        <div class="dash-kpis">
            <div class="title-subtitle">
                <h1>
                    Histórico
                </h1>
                <span>
                    Registro de ocorrências de congestionamento prolongado
                </span>
            </div>

            <div class="kpis">
                <div class="kpi-01">
                    <span>Ocorrências</span>
                    <div class="sector-amount">
                        <h2>Total:</h2>
                        <h2 class="amount-danger">32</h2>
                    </div>
                </div>

                <div class="kpi-01">
                    <span>Tempo excedente:</span>
                    <div class="sector-amount">
                        <h2>Total:</h2>
                        <h2 class="amount-danger">1h24min</h2>
                    </div>
                </div>
            </div>

            <div class="title-graph">
                <h1>
                    Picos de Congestionamento (Acima do Limite)
                </h1>

                <h3>
                    Ocorrências por hora que excederam o limite máximo estabelecido.
                </h3>

            <div class="grafico_linha">
                <canvas id="grafico_linha"></canvas>
            </div>

            <div class="grafico_barra">
                <canvas id="grafico_barra"></canvas>
            </div>

            </div>
        </div>
    </main>
</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>

<script>
    const ctx = document.getElementById('grafico_linha');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['06:00', '08:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00', '22:00', '00:00'],
        datasets: [{
            label: 'Setor de bebidas',
            data: [3, 0, 5, 2, 4, 7, 6, 5, 10, 8],
            backgroundColor: [
                'rgb(15, 28, 38)'
            ],
            borderWidth: 1,
             borderColor: [
                'rgb(15, 28, 38)'
            ] 
            }
            ,
            {
            label: 'Setor alimentício',
            data: [1, 1, 4, 6, 10, 5, 9, 11, 2, 3],
            backgroundColor: [
                'rgb(255, 123, 0)'
            ],
            borderWidth: 1,
            borderColor: [
                'rgb(255, 123, 0)'
            ] 
        }]
      },
       options: {
      scales: {
        y: {
          beginAtZero: true,
          ticks:{
            stepSize: 2
          }
        }
      },
        plugins: {
          annotation: {
            annotations: {
              linhaLimite: {
                type: 'line',
                yMin: 5,
                yMax: 5,
                borderColor: 'rgb(0,0,0)',
                borderWidth: 2,
                borderDash: [6, 6],
                label: {
                  content: 'Meta / Limite (10)',
                  enabled: true,
                  position: 'end'
                }
              }
            }
          }
        }
      }
    });

    const ctx1 = document.getElementById('grafico_barra');

    new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'],
        datasets: [{
            label: 'Setor de bebidas',
            data: [3, 0, 5, 2, 4, 7, 6, 5, 10, 8],
            backgroundColor: [
                'rgb(15, 28, 38)'
            ],
            borderWidth: 1,
             borderColor: [
                'rgb(15, 28, 38)'
            ] 
            }
            ,
            {
            label: 'Setor alimentício',
            data: [1, 1, 4, 6, 10, 5, 9, 11, 2, 3],
            backgroundColor: [
                'rgb(255, 123, 0)'
            ],
            borderWidth: 1,
            borderColor: [
                'rgb(255, 123, 0)'
            ] 
        }]
      },
       options: {
      scales: {
        y: {
          beginAtZero: true,
          ticks:{
            stepSize: 2
          }
         }
        }
      }
    });
</script>
