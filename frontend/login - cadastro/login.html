                <label for="ipt_email">Email:</label>

<script>
    let tentativas = 3;
    function login() {
        let email = ipt_email.value;
        let senha = ipt_senha.value;

        // Bloqueia se acabaram as tentativas
        if (tentativas <= 0) {
            alert("Número máximo de tentativas atingido. Tente mais tarde.");
        }

        // Validação de campos vazios (não gasta tentativa)
        if (email == "") {
            alert("Email está vazio, preencha o campo.");
        } else if (senha == "") {
            alert("Senha está vazia, preencha o campo.");
        }

        // Validação das credenciais 
        if (email == "adm@email.com" && senha == "12345") { // ADM
            alert("Login realizado com sucesso!")
            location.href = "../dashboard/mercados.html"; // direciona para o mercado
        } else if (email == "funcionario@email.com" && senha == "12345") { // Funcionário
            alert("Login realizado com sucesso!")
            location.href = "../dashboard/dashboard.html"; // direciona para a dashboard
        } else {
            tentativas--;
            if (tentativas > 0) {
                alert(`Email ou senha incorretos. Você ainda tem ${tentativas} tentativa(s).`);
            } else {
                alert("Número máximo de tentativas atingido.");
            }
        }
    }
</script>
